# Producción: servidor de Oracle Cloud + MySQL en Aiven.
# Las credenciales NUNCA van escritas aquí: se leen del archivo /etc/ocumare/ocumare.env
# del servidor (ver docs/despliegue.md y deploy/ocumare.env.ejemplo).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# "update" crea las tablas la primera vez y agrega columnas nuevas en cada versión.
# Nunca borra datos. Se puede fijar en "validate" con DDL_AUTO=validate si se prefiere.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.h2.console.enabled=false

# La aplicación solo escucha dentro del servidor; Caddy la publica con HTTPS.
server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=framework
server.compression.enabled=true
