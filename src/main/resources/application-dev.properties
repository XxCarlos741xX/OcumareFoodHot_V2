# Desarrollo local: base H2 en memoria, se borra al apagar la app
spring.datasource.url=jdbc:h2:mem:ocumare;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Solo para desarrollo local. NUNCA usar estos valores en producción.
ocumare.jwt.secret=dev-secreto-solo-local-0123456789-abcdefghij
ocumare.admin.password=admin123

# Carta, mesas y usuarios de ejemplo para probar en el PC (gerente / gerente123, caja / caja12345, ana / ana12345).
ocumare.datos-prueba=true

# En desarrollo la app web se lee directo de la carpeta: al recompilar el frontend se ve sin reiniciar.
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/

# En el PC se entra por http://localhost, sin HTTPS: la cookie de sesión no puede exigirlo.
ocumare.sesion.cookie-segura=false
# El servidor de desarrollo de Vite (npm run dev) corre en otro puerto.
ocumare.cors.origenes=http://localhost:5173
