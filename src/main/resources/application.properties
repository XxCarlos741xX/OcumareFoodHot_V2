spring.application.name=ocumare_food
# Perfil por defecto: dev (H2 en memoria). En el servidor se arranca con SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Caracas

# ---- Seguridad ----
# Clave para firmar los tokens JWT (mínimo 32 caracteres). En producción viene de la variable JWT_SECRET.
ocumare.jwt.secret=${JWT_SECRET}
# Horas que dura una sesión (un turno largo).
ocumare.jwt.horas=12
# Admin que se crea solo la primera vez, si no existe ningún admin.
ocumare.admin.username=${ADMIN_USERNAME:admin}
ocumare.admin.password=${ADMIN_PASSWORD:}
# Orígenes (dominios) desde donde el navegador puede llamar a la API, separados por coma.
ocumare.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Aviso a Telegram de cada pedido web (opcional). Vacío = desactivado.
ocumare.telegram.token=${TELEGRAM_TOKEN:}
ocumare.telegram.chat-id=${TELEGRAM_CHAT_ID:}
# Cargar la carta real la primera vez (si la base no tiene categorías).
ocumare.carta-inicial=true

# Tasa oficial del BCV automática (DolarAPI, cada hora). TASA_BCV_ACTIVA=false la apaga.
ocumare.tasa-bcv.activa=${TASA_BCV_ACTIVA:true}
ocumare.tasa-bcv.url=https://ve.dolarapi.com/v1/dolares/oficial

# Fotos de productos (el navegador ya las achica; esto es un tope de seguridad).
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
